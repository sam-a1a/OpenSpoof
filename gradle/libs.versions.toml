[versions]
agp = "9.3.1"
kotlin = "2.2.10"
# Material 3 Expressive (MaterialExpressiveTheme, MotionScheme, FloatingToolbar,
# FloatingActionButtonMenu, LoadingIndicator, MaterialShapes) only ships in the
# 1.5.0 alpha line; 1.4.0 is the newest stable and predates most of it.
material3 = "1.5.0-alpha25"
activityCompose = "1.13.0"

[libraries]
# No Compose BOM on purpose: the newest BOM (2026.06.01) pins compose-ui to
# 1.11.4, but material3 1.5.0-alpha25 needs 1.12.0-beta01. Depending on
# material3 directly resolves one consistent stack and transitively supplies
# ui, foundation, animation, runtime, graphics-shapes and material3-ripple.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
